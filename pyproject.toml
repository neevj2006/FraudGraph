[project]
name = "fraudgraph"
version = "0.1.0"
description = "Temporal graph fraud investigation workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "xgboost>=3,<4",
    "torch>=2.6,<3",
    "torch-geometric>=2.6,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "joblib>=1.4,<2",
    "matplotlib>=3.10,<4",
    "psutil>=7,<8",
    "pyjwt[crypto]>=2.14,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.optional-dependencies]
tracking = ["mlflow-skinny>=3,<4", "alembic>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
